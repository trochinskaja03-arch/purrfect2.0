[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Безпека: сторонніми на сторінці є лише шрифти Google і вікно оплати LiqPay.
# Вікно оплати — це скрипт із static.liqpay.ua, який вставляє iframe з
# www.liqpay.ua: звідси script-src, frame-src і connect-src на домени LiqPay.
# Запасний шлях (перехід на сторінку оплати) — це POST-форма на liqpay.ua,
# тож form-action лишається.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = """
      default-src 'self';
      img-src 'self' data: https://static.liqpay.ua https://www.liqpay.ua;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://static.liqpay.ua;
      font-src 'self' https://fonts.gstatic.com https://static.liqpay.ua;
      script-src 'self' 'unsafe-inline' https://static.liqpay.ua;
      connect-src 'self' https://api.novaposhta.ua https://www.liqpay.ua https://static.liqpay.ua;
      frame-src https://www.liqpay.ua https://static.liqpay.ua;
      form-action 'self' https://www.liqpay.ua;
      frame-ancestors 'self';
      base-uri 'self'"""

# HTML і код сторінки не кешуємо: після правок браузер має одразу бачити
# нову версію, а не тримати стару зі свого кешу.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sans/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
